name: MiniSO Lab CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required files
        run: |
          echo "Checking required repository files..."

          REQUIRED_FILES=(
            "README.md"
            ".gitignore"
            "CONTRIBUTING.md"
            "DEVELOPMENT_STATE.md"
            "process_runner/main.cpp"
            "process_runner/ProcessChild.cpp"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi

            echo "Found: $file"
          done

      - name: Validate GitHub configuration
        run: |
          echo "Checking GitHub configuration..."

          test -f ".github/pull_request_template.md" || {
            echo "ERROR: Pull Request template not found."
            exit 1
          }

          echo "GitHub configuration is valid."

  cmake-build:
    name: CMake Build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CMake project status
        id: cmake-status
        run: |
          if [ ! -f "CMakeLists.txt" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CMakeLists.txt does not exist yet."
            exit 0
          fi

          if ! grep -q "cmake_minimum_required" CMakeLists.txt; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CMake project is not configured yet."
            exit 0
          fi

          if ! grep -q "project(" CMakeLists.txt; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CMake project is not configured yet."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "CMake project detected."

      - name: Install build dependencies
        if: steps.cmake-status.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build

      - name: Configure
        if: steps.cmake-status.outputs.ready == 'true'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMINISO_BUILD_TESTS=ON \
            -DMINISO_ENABLE_SANITIZERS=OFF

      - name: Build
        if: steps.cmake-status.outputs.ready == 'true'
        run: |
          cmake --build build

      - name: Run tests
        if: steps.cmake-status.outputs.ready == 'true'
        run: |
          if [ -f "build/CTestTestfile.cmake" ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "No tests configured yet."
          fi